name: Agent Policy Rollout

on:
  push:
    branches: [main]
    paths: [.github/agent-policy-channels.json]
  repository_dispatch:
    types: [agent-policy-rollout-ready, agent-policy-rollout-abort]

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: agent-policy-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ${{ format('arc-{0}', github.repository_owner) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      # cosign-installer v4 shells out to envsubst, which is not part of the
      # provider-neutral general runner contract. Download the publisher-
      # compatible cosign v3 binary directly and verify its pinned SHA-256.
      - name: Install signature verifier
        env:
          COSIGN_VERSION: v3.0.6
          COSIGN_SHA256_AMD64: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          COSIGN_SHA256_ARM64: bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset=cosign-linux-amd64; expected="$COSIGN_SHA256_AMD64" ;;
            aarch64 | arm64) asset=cosign-linux-arm64; expected="$COSIGN_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/hv-cosign"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/$asset"
          actual=$(python3 - "$install_dir/cosign" <<'PY'
          import hashlib
          import pathlib
          import sys

          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )
          test "$actual" = "$expected" || {
            echo "cosign checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          chmod +x "$install_dir/cosign"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cosign" version
      - name: Install GitHub CLI
        env:
          GH_VERSION: 2.96.0
          GH_SHA256_AMD64: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          GH_SHA256_ARM64: 06f86ec7103d41993b76cd78072f43595c34aaa56506d971d9860e67140bf909
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset_arch=amd64; expected="$GH_SHA256_AMD64" ;;
            aarch64 | arm64) asset_arch=arm64; expected="$GH_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/hv-gh"
          archive="$install_dir/gh.tar.gz"
          mkdir -p "$install_dir"
          curl -fsSL -o "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${asset_arch}.tar.gz"
          actual=$(python3 - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )
          test "$actual" = "$expected" || {
            echo "GitHub CLI checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          gh_dir="$install_dir/gh_${GH_VERSION}_linux_${asset_arch}/bin"
          python3 - "$archive" "$install_dir" "$gh_dir/gh" <<'PY'
          import pathlib
          import stat
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          binary = pathlib.Path(sys.argv[3])
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit(f"unsafe GitHub CLI archive member: {member.name}")
              bundle.extractall(destination)
          binary.chmod(binary.stat().st_mode | stat.S_IXUSR)
          PY
          echo "$gh_dir" >> "$GITHUB_PATH"
          "$gh_dir/gh" version
      - name: Mint ring dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HV_AGENT_PROMOTER_APP_ID }}
          private-key: ${{ secrets.HV_AGENT_PROMOTER_APP_PRIVATE_KEY }}
          owner: happyvertical
          permission-actions: write
      - name: Mint authority transition token
        id: promoter-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.HV_AGENT_PROMOTER_APP_ID }}
          private-key: ${{ secrets.HV_AGENT_PROMOTER_APP_PRIVATE_KEY }}
          owner: happyvertical
          repositories: .github
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # Abort and rollback restore the substrate of the lock they restore,
          # which includes the two authority workflow files.
          permission-workflows: write
      - name: Select active rollout phase
        id: phase
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
          ROLLOUT_READY: ${{ github.event.client_payload.rollout_ready }}
          ROLLOUT_ABORT: ${{ github.event.client_payload.rollout_abort }}
          READY_REVISION: ${{ github.event.client_payload.state_revision }}
        run: |
          set -euo pipefail
          phase=$(jq -r '.promotion.phase // "none"' .github/agent-policy-channels.json)
          state_revision=$(jq -r '.revision' .github/agent-policy-channels.json)
          case "$phase" in canary|smoke|none) ;; *) exit 1 ;; esac
          if test "$EVENT_NAME" = repository_dispatch \
              && test "$DISPATCH_TYPE" = agent-policy-rollout-abort; then
            test "$phase" = canary || {
              echo 'an explicit policy abort requires an active canary phase' >&2
              exit 1
            }
            test "$ROLLOUT_ABORT" = true || {
              echo 'rollout_abort=true is required for an explicit policy abort' >&2
              exit 1
            }
            if ! [[ "$READY_REVISION" =~ ^[0-9]+$ ]] \
                || test "$READY_REVISION" != "$state_revision"; then
              echo "explicit abort targets revision $READY_REVISION, current state is $state_revision" >&2
              exit 1
            fi
            echo "force_abort=true" >> "$GITHUB_OUTPUT"
          elif test "$phase" != none && test "$EVENT_NAME" = push; then
            echo "policy $phase is paused for ring migration and explicit readiness confirmation"
            phase=none
          elif test "$phase" != none && test "$ROLLOUT_READY" != true; then
            echo "rollout_ready=true is required for the active $phase ring" >&2
            exit 1
          elif test "$phase" != none \
              && { ! [[ "$READY_REVISION" =~ ^[0-9]+$ ]] \
                || test "$READY_REVISION" != "$state_revision"; }; then
            echo "readiness targets revision $READY_REVISION, current state is $state_revision" >&2
            exit 1
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
      - name: Run exact default-head ring
        if: ${{ steps.phase.outputs.phase != 'none' }}
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          PHASE: ${{ steps.phase.outputs.phase }}
          FORCE_ABORT: ${{ steps.phase.outputs.force_abort }}
        run: |
          canary_command=(
            scripts/hv-agent-policy-canary
            .github/agent-policy-channels.json "$RUNNER_TEMP/evidence.json"
            --phase "$PHASE"
          )
          if test "$FORCE_ABORT" = true; then
            canary_command+=(--cancel)
          fi
          canary_command+=(--apply)
          "${canary_command[@]}"
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/evidence.bundle" \
            "$RUNNER_TEMP/evidence.json"
      - name: Apply verified transition
        if: ${{ steps.phase.outputs.phase != 'none' }}
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          FORCE_ABORT: ${{ steps.phase.outputs.force_abort }}
        run: |
          set -euo pipefail
          state=.github/agent-policy-channels.json
          evidence="$RUNNER_TEMP/evidence.json"
          revision=$(jq -r '.revision' "$state")
          if test "$FORCE_ABORT" = true; then
            test "$PHASE" = canary || {
              echo 'only an active canary may be explicitly aborted' >&2
              exit 1
            }
            action=abort
          elif jq -e '(.errors | length == 0) and (.results | length > 0) and all(.results[]; .conclusion == "success")' "$evidence" >/dev/null; then
            action=$([ "$PHASE" = canary ] && echo promote || echo finalize)
          else
            action=$([ "$PHASE" = canary ] && echo abort || echo rollback)
          fi
          transition_command=(
            scripts/hv-agent-policy-channels "$action" "$state" "$evidence"
          )
          if test "$FORCE_ABORT" = true; then
            transition_command+=(--require-cancelled-ring)
          fi
          transition_command+=(--expected-revision "$revision" --apply)
          "${transition_command[@]}"
          jq '.channels.stable' "$state" > .github/agent-policy-lock.json
          next_revision=$(jq -r '.revision' "$state")
          evidence_path=".github/agent-policy-evidence/revision-${next_revision}.json"
          evidence_bundle_path=".github/agent-policy-evidence/revision-${next_revision}.bundle"
          mkdir -p "$(dirname "$evidence_path")"
          cp "$evidence" "$evidence_path"
          cp "$RUNNER_TEMP/evidence.bundle" "$evidence_bundle_path"
          {
            echo "action=$action"
            echo "revision=$next_revision"
            echo "evidence_path=$evidence_path"
            echo "evidence_bundle_path=$evidence_bundle_path"
          } >> "$GITHUB_ENV"
      - name: Reconcile substrate with the resulting stable generation
        if: ${{ steps.phase.outputs.phase != 'none' }}
        env:
          POLICY_PUBLISHER_IDENTITY: ${{ vars.AGENT_POLICY_PUBLISHER_IDENTITY }}
        run: |
          set -euo pipefail
          # A candidate that changed authority substrate is migrated into this
          # repository during the paused canary window, so abort and rollback
          # must return the substrate together with the older stable lock they
          # restore; promote and finalize copy identical bytes and change
          # nothing. Without this the restored generation would face substrate
          # it cannot recognize and its own required check would fail closed.
          artifact=$(jq -r '.channels.stable.artifact' .github/agent-policy-channels.json)
          case "$artifact" in
            ghcr.io/happyvertical/agent-policy@sha256:*) ;;
            *) echo 'restored stable lock must pin the trusted policy image by digest' >&2; exit 1 ;;
          esac
          expected_publisher_identity_sha256=86a917ce537a9e923ce02103068c76eb72629247ab584f7d368ac238a0209857
          publisher_identity_sha256=$(python3 -c 'import hashlib, os; print(hashlib.sha256(os.environ["POLICY_PUBLISHER_IDENTITY"].encode()).hexdigest())')
          test "$publisher_identity_sha256" = "$expected_publisher_identity_sha256" || {
            echo 'AGENT_POLICY_PUBLISHER_IDENTITY must match the exact protected-main publisher identity' >&2
            exit 1
          }
          publisher_workflow="${POLICY_PUBLISHER_IDENTITY%@refs/heads/main}"
          test "$publisher_workflow" != "$POLICY_PUBLISHER_IDENTITY" || {
            echo 'AGENT_POLICY_PUBLISHER_IDENTITY must name the protected-main publisher workflow' >&2
            exit 1
          }
          publisher_workflow_regexp=$(printf '%s' "$publisher_workflow" | sed 's/[][\.*^()+?{}|$]/\\&/g')
          cosign verify "$artifact" \
            --certificate-identity-regexp "^${publisher_workflow_regexp}@refs/(heads/main|tags/agent-policy-v[0-9]+\.[0-9]+\.[0-9]+)$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          rm -rf "$RUNNER_TEMP/stable-download" "$RUNNER_TEMP/stable-policy"
          mkdir -p "$RUNNER_TEMP/stable-download" "$RUNNER_TEMP/stable-policy"
          oras pull "$artifact" -o "$RUNNER_TEMP/stable-download"
          archive="$RUNNER_TEMP/stable-download/agent-policy.tar.gz"
          test -f "$archive" || { echo 'policy artifact is missing agent-policy.tar.gz' >&2; exit 1; }
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe policy archive member: {member.name}")
          PY
          tar -xzf "$archive" -C "$RUNNER_TEMP/stable-policy"
          python3 "$RUNNER_TEMP/stable-policy/scripts/verify-policy-artifact" \
            "$RUNNER_TEMP/stable-policy" >/dev/null
          python3 - .github/agent-policy-channels.json \
            "$RUNNER_TEMP/stable-policy/policy-artifact.json" <<'PY'
          import json
          import sys

          lock = json.load(open(sys.argv[1], encoding="utf-8"))["channels"]["stable"]
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          for field in ["generation", "policy_revision", "source_commit", "source_tree_sha256"]:
              if lock.get(field) != manifest.get(field):
                  raise SystemExit(
                      f"restored stable lock {field} does not match the signed artifact manifest"
                  )
          PY
          substrate_pairs=(
            "templates/github/agent-policy-authority.yml:.github/workflows/agent-policy.yml"
            "templates/github/agent-policy-rollout.yml:.github/workflows/agent-policy-rollout.yml"
            "scripts/hv-agent-policy-channel-select:scripts/hv-agent-policy-channel-select"
            "scripts/hv-agent-policy-canary:scripts/hv-agent-policy-canary"
            "scripts/hv-agent-policy-channels:scripts/hv-agent-policy-channels"
            "scripts/hv_agent_policy_channels.py:scripts/hv_agent_policy_channels.py"
          )
          for pair in "${substrate_pairs[@]}"; do
            source="$RUNNER_TEMP/stable-policy/${pair%%:*}"
            installed=${pair#*:}
            test -f "$source" || {
              echo "restored policy artifact lacks $installed substrate" >&2
              exit 1
            }
            cmp -s "$source" "$installed" || cp -p "$source" "$installed"
          done
      - name: Open protected transition pull request
        if: ${{ steps.phase.outputs.phase != 'none' }}
        env:
          GH_TOKEN: ${{ steps.promoter-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="agent/policy-channel-${revision}-${action}"
          git config user.name "hv-agent-promoter[bot]"
          git config user.email "hv-agent-promoter[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch -c "$branch"
          git add .github/agent-policy-channels.json .github/agent-policy-lock.json \
            "$evidence_path" "$evidence_bundle_path" \
            .github/workflows/agent-policy.yml \
            .github/workflows/agent-policy-rollout.yml \
            scripts/hv-agent-policy-channel-select \
            scripts/hv-agent-policy-canary \
            scripts/hv-agent-policy-channels \
            scripts/hv_agent_policy_channels.py
          git commit -m "chore(agent-policy): ${action} channel revision ${revision}"
          git push origin "$branch"
          body="$RUNNER_TEMP/promotion-pr.md"
          issue_body="$RUNNER_TEMP/promotion-issue.md"
          session="policy-rollout-$GITHUB_RUN_ID"
          {
            echo "Protected policy-channel transition generated by the rollout workflow."
            echo
            echo "- Action: \`$action\`"
            echo "- Revision: \`$revision\`"
            echo "- Claim runtime: \`github-actions\`"
            echo "- Claim session: \`$session\`"
            echo
            echo "Claim and release this issue through the canonical lifecycle before merging its PR."
          } > "$issue_body"
          issue_url=$(gh issue create --repo happyvertical/.github \
            --title "chore(agent-policy): ${action} channel revision ${revision}" \
            --body-file "$issue_body")
          issue_number=${issue_url##*/}
          runtime_policy_revision=$(
            jq -er '.policy_revision | select(type == "string" and length > 0)' \
              .github/agent-policy-lock.json
          )
          canonical_evidence_sha256=$(
            jq -er \
              '.transition.evidence_sha256
               | select(type == "string" and test("^[0-9a-f]{64}$"))' \
              .github/agent-policy-channels.json
          )
          {
            echo "Automated protected policy-channel transition."
            echo
            echo "- Action: \`$action\`"
            echo "- Revision: \`$revision\`"
            echo "- Canonical evidence SHA-256: \`$canonical_evidence_sha256\`"
            echo "- Signed bundle SHA-256: \`$(shasum -a 256 "$RUNNER_TEMP/evidence.bundle" | awk '{print $1}')\`"
            echo
            echo "Closes #$issue_number"
            echo
            echo "<!-- hv-agent-run:v1 -->"
            jq -cn \
              --arg session "$session" \
              --argjson issue "$issue_number" \
              --arg policy_revision "$runtime_policy_revision" \
              '{
                schema: "hv-agent-run:v1",
                runtime: "github-actions",
                session: $session,
                issue: $issue,
                policy_revision: $policy_revision,
                status: "complete",
                validation: [
                  "protected rollout recorded a signed exact-default-head evidence bundle",
                  "canonical channel transition applied at the expected revision"
                ]
              }'
          } > "$body"
          url=$(gh pr create --repo happyvertical/.github --base main --head "$branch" \
            --title "chore(agent-policy): ${action} channel revision ${revision}" \
            --body-file "$body")
          echo "Opened $url; merge only after the canonical issue claim, review release, and required checks complete."
