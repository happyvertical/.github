name: Org Agent Autopilot

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to work on'
        required: true
        type: number
      action:
        description: 'Label action (labeled or unlabeled)'
        required: true
        type: string
      label_name:
        description: 'Label that triggered this workflow'
        required: true
        type: string
      project_id:
        description: 'Deprecated GitHub Projects board ID; retained during caller migration'
        required: false
        type: string
        default: ''
      status_field_id:
        description: 'Deprecated project Status field ID; retained during caller migration'
        required: false
        type: string
        default: ''
      status_in_progress_id:
        description: 'Deprecated In Progress option ID; retained during caller migration'
        required: false
        type: string
        default: ''
      status_review_id:
        description: 'Deprecated Review option ID; retained during caller migration'
        required: false
        type: string
        default: ''
      policy_artifact:
        description: 'Deprecated policy OCI digest; ignored since claims moved to plain GitHub state'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code OAuth token'
        required: true
      GH_TOKEN:
        description: 'GitHub token for API access'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: autopilot-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false  # Don't cancel ongoing work

jobs:
  implement:
    if: "${{ inputs.action == 'labeled' && inputs.label_name == 'dispatch: claude' }}"
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'arc-happyvertical' }}
    timeout-minutes: 60
    steps:
      - name: Check Issue State
        id: check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          STATE=$(gh issue view ${{ inputs.issue_number }} --repo "${{ github.repository }}" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "Issue is closed, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # A claim is plain GitHub state: the `agent: implementation` label plus one
      # `<!-- hv-claim -->` comment that later steps edit in place. There are no
      # leases, no expiry and nothing to renew, so this step never runs a claim
      # binary and the job has no heartbeat.
      - name: Claim implementation
        if: steps.check.outputs.skip != 'true'
        id: claim
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
          SESSION_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
          BRANCH: agent/issue-${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAIM_LABEL: 'agent: implementation'
        run: |
          set -euo pipefail
          claim_date="$(date -u +%F)"
          echo "date=$claim_date" >> "$GITHUB_OUTPUT"

          # Newest claim comment on the issue, new marker or legacy lease alike:
          # id, last edit, whether it is still held, and whether this run wrote it.
          prior="$(gh api --paginate "repos/$GH_REPO/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '
            .[]
            | select(.body | test("<!-- hv-claim -->|hv-agent-claim:v1"))
            | [ (.id | tostring),
                .updated_at,
                (if (.body | test("\\*\\*Status:\\*\\*[ ]*(review|blocked|abandoned|withdrawn|superseded)"; "i"))
                    or (.body | test("released_at"))
                 then "done" else "held" end),
                (if (.body | test("github-actions:" + env.RUN_ID + ":")) then "mine" else "other" end) ]
            | @tsv' | tail -n 1)"

          prior_id=""; prior_updated=""; prior_state=""; prior_owner=""
          if [ -n "$prior" ]; then
            IFS=$'\t' read -r prior_id prior_updated prior_state prior_owner <<<"$prior" || true
          fi

          labels="$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json labels --jq '.labels[].name')"
          has_label=false
          if printf '%s\n' "$labels" | grep -Fxq "$CLAIM_LABEL"; then
            has_label=true
          fi

          comment_id=""
          if [ "$prior_owner" = "mine" ]; then
            # Re-run of this same workflow run: keep the comment it already posted.
            comment_id="$prior_id"
          elif [ "$prior_state" = "held" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$prior_updated" +%s) ))
            if [ "$has_label" = true ] && [ "$age" -lt 86400 ]; then
              echo "::warning::#$ISSUE_NUMBER is held by another session (comment $prior_id, updated $prior_updated)"
              gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "Autopilot stood down: this issue already carries an active \`$CLAIM_LABEL\` claim (comment ${prior_id}, last updated ${prior_updated}). Hand that claim off, then re-apply \`dispatch: claude\`."
              echo "claimed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Stale claim (no activity for 24h): take it over in the open by
            # marking the prior comment superseded. Claim history is never deleted.
            prior_body="$RUNNER_TEMP/prior-claim.md"
            gh api "repos/$GH_REPO/issues/comments/$prior_id" --jq '.body' > "$prior_body"
            printf "\n\n**Status:** superseded — stale claim taken over by hosted autopilot session \`%s\` on %s\n" \
              "$SESSION_ID" "$claim_date" >> "$prior_body"
            gh api "repos/$GH_REPO/issues/comments/$prior_id" -X PATCH -F "body=@$prior_body"
          fi

          claim_body="$(printf "<!-- hv-claim -->\nClaimed by **claude** · session \`%s\` · branch \`%s\` · %s\n\nHosted autopilot run: %s\n" \
            "$SESSION_ID" "$BRANCH" "$claim_date" "$RUN_URL")"

          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label "$CLAIM_LABEL"

          if [ -n "$comment_id" ]; then
            # Re-run of this run: refresh its comment instead of stacking a second one.
            gh api "repos/$GH_REPO/issues/comments/$comment_id" -X PATCH -f "body=$claim_body"
          else
            url="$(gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$claim_body")"
            comment_id="${url##*-}"
          fi

          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "claimed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Git
        if: steps.claim.outputs.claimed == 'true'
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Setup Node.js
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        if: steps.claim.outputs.claimed == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: steps.claim.outputs.claimed == 'true'
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            pnpm install || npm install
          fi
        continue-on-error: true

      - name: Run Claude Implementation
        if: steps.claim.outputs.claimed == 'true'
        id: implement
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ inputs.issue_number }}

            You are implementing issue #${{ inputs.issue_number }} autonomously.

            The issue is already claimed for you: it carries the
            `agent: implementation` label and a `<!-- hv-claim -->` comment for this
            run. Do not post another claim comment and do not remove that label;
            the workflow hands the claim off after you finish.

            ## Workflow

            1. **Read the issue**: `gh issue view ${{ inputs.issue_number }}`
            2. **Read AGENTS.md** and the repository manifest for repository guidelines
            3. **Create branch**: `git checkout -b agent/issue-${{ inputs.issue_number }}-[description]`
            4. **Implement** following existing patterns
            5. **Write/update tests**
            6. **Quality checks**: `pnpm typecheck && pnpm lint && pnpm test && pnpm build`
            7. **Commit**: `git commit -m "feat(scope): description\n\nCloses #${{ inputs.issue_number }}"`
            8. **Push**: `git push -u origin [branch]`
            9. **Create a draft PR while implementing**, closing issue #${{ inputs.issue_number }}.
               List the validation commands you actually ran in the body.

            Do not merge. The workflow marks the PR ready for review and hands the
            claim off to review when you finish.

            ## If Blocked

            If you cannot complete the implementation (unclear requirements, need decisions, etc.):
            1. Post a comment on the issue explaining what you need
            2. Remove the `dispatch: claude` label so the workflow doesn't re-trigger
            3. The human can clarify and re-apply the label when ready

            ```bash
            gh issue comment ${{ inputs.issue_number }} --body "## Need Clarification\n\n[your questions here]\n\n---\n*Removing \`dispatch: claude\` label until clarified*"
            gh issue edit ${{ inputs.issue_number }} --remove-label "dispatch: claude"
            ```

          claude_args: |
            --allowedTools Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(pnpm:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(bun:*),Read,Write,Edit,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(rm:*)

      - name: Hand off claim to review
        if: success() && steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ steps.claim.outputs.comment_id }}
          CLAIM_DATE: ${{ steps.claim.outputs.date }}
          SESSION_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
          BRANCH: agent/issue-${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAIM_LABEL: 'agent: implementation'
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GH_REPO" --state open --json number,closingIssuesReferences \
            --jq "map(select(any(.closingIssuesReferences[]?; .number == $ISSUE_NUMBER))) | first | .number // empty")
          test -n "$pr_number" || { echo 'implementation completed without a linked PR' >&2; exit 1; }
          gh pr ready "$pr_number" --repo "$GH_REPO" || true
          body="$(printf "<!-- hv-claim -->\nClaimed by **claude** · session \`%s\` · branch \`%s\` · %s\n\nHosted autopilot run: %s\n\n**Status:** review — PR #%s\n" \
            "$SESSION_ID" "$BRANCH" "$CLAIM_DATE" "$RUN_URL" "$pr_number")"
          gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID" -X PATCH -f "body=$body"
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --remove-label "$CLAIM_LABEL"

      - name: Post Failure Comment
        if: failure() && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh issue comment ${{ inputs.issue_number }} --repo "${{ github.repository }}" --body "## Implementation Failed

          I encountered an error while implementing this issue.

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          The \`dispatch: claude\` label remains - remove it if you want to stop automated attempts.

          ---
          *Automated implementation by Claude*"

      - name: Hand off claim as blocked
        if: failure() && steps.claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          COMMENT_ID: ${{ steps.claim.outputs.comment_id }}
          CLAIM_DATE: ${{ steps.claim.outputs.date }}
          SESSION_ID: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
          BRANCH: agent/issue-${{ inputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAIM_LABEL: 'agent: implementation'
        run: |
          set -euo pipefail
          body="$(printf "<!-- hv-claim -->\nClaimed by **claude** · session \`%s\` · branch \`%s\` · %s\n\nHosted autopilot run: %s\n\n**Status:** blocked — hosted implementation stopped; next: review the workflow log and resume from the smallest failing step.\n" \
            "$SESSION_ID" "$BRANCH" "$CLAIM_DATE" "$RUN_URL")"
          gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID" -X PATCH -f "body=$body"
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --remove-label "$CLAIM_LABEL"
          gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label 'status: blocked' \
            || echo "::warning::could not add 'status: blocked' to #$ISSUE_NUMBER"
