name: Agent Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to recheck after released_at or another claim-only transition
        required: true
        type: number

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read
  statuses: read
  packages: read

concurrency:
  group: >-
    agent-policy-authority-${{
      github.event.merge_group.head_sha ||
      github.event.pull_request.number ||
      inputs.pr_number ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  lifecycle:
    # A generated transition needs GitHub to allocate its PR number before its
    # exact-head metadata and canonical claim can be written.  Keep that short
    # construction interval draft-only: the first evaluated lifecycle is the
    # ready-for-review event emitted after the producer has released its claim.
    # This is not an authorization bypass -- drafts cannot enter review or a
    # merge queue, and every non-draft event remains fail-closed below.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.event.pull_request.draft == false }}
    name: lifecycle
    runs-on: ${{ format('arc-{0}', github.repository_owner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2
      # cosign-installer v4 shells out to envsubst, which is not part of the
      # provider-neutral general runner contract. Download the publisher-
      # compatible cosign v3 binary directly and verify its pinned SHA-256 so
      # lifecycle enforcement has the same dependencies on every provider.
      - name: Install signature verifier
        env:
          COSIGN_VERSION: v3.0.6
          COSIGN_SHA256_AMD64: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
          COSIGN_SHA256_ARM64: bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset=cosign-linux-amd64; expected="$COSIGN_SHA256_AMD64" ;;
            aarch64 | arm64) asset=cosign-linux-arm64; expected="$COSIGN_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/hv-cosign"
          mkdir -p "$install_dir"
          curl -fsSL -o "$install_dir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/$asset"
          actual=$(python3 - "$install_dir/cosign" <<'PY'
          import hashlib
          import pathlib
          import sys

          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )
          test "$actual" = "$expected" || {
            echo "cosign checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          chmod +x "$install_dir/cosign"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/cosign" version
      - name: Install GitHub CLI
        env:
          GH_VERSION: 2.96.0
          GH_SHA256_AMD64: 83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          GH_SHA256_ARM64: 06f86ec7103d41993b76cd78072f43595c34aaa56506d971d9860e67140bf909
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) asset_arch=amd64; expected="$GH_SHA256_AMD64" ;;
            aarch64 | arm64) asset_arch=arm64; expected="$GH_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install_dir="$RUNNER_TEMP/hv-gh"
          archive="$install_dir/gh.tar.gz"
          mkdir -p "$install_dir"
          curl -fsSL -o "$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${asset_arch}.tar.gz"
          actual=$(python3 - "$archive" <<'PY'
          import hashlib
          import pathlib
          import sys

          print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())
          PY
          )
          test "$actual" = "$expected" || {
            echo "GitHub CLI checksum mismatch: expected $expected, got $actual" >&2
            exit 1
          }
          gh_dir="$install_dir/gh_${GH_VERSION}_linux_${asset_arch}/bin"
          python3 - "$archive" "$install_dir" "$gh_dir/gh" <<'PY'
          import pathlib
          import stat
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          binary = pathlib.Path(sys.argv[3])
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not (member.isfile() or member.isdir())
                  ):
                      raise SystemExit(f"unsafe GitHub CLI archive member: {member.name}")
              bundle.extractall(destination)
          binary.chmod(binary.stat().st_mode | stat.S_IXUSR)
          PY
          echo "$gh_dir" >> "$GITHUB_PATH"
          "$gh_dir/gh" version
      - name: Select source-owned policy channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY_NUMERIC_ID: ${{ github.repository_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_repository=$(gh api repos/happyvertical/.github --jq '.id')
          test "$source_repository" = 1129270614 || {
            echo "trusted policy source repository id is $source_repository, expected 1129270614" >&2
            exit 1
          }
          active_state="$RUNNER_TEMP/hv-agent-policy-active-channels.json"
          active_lock="$RUNNER_TEMP/hv-agent-policy-active-lock.json"
          active_state_error="$RUNNER_TEMP/hv-agent-policy-active-channels.error"
          protected_selector="$RUNNER_TEMP/hv-agent-policy-channel-select"
          protected_channels="$RUNNER_TEMP/hv_agent_policy_channels.py"
          channels_active=true
          if gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/happyvertical/.github/contents/.github/agent-policy-channels.json?ref=main' \
              > "$active_state" 2> "$active_state_error"; then
            gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/happyvertical/.github/contents/scripts/hv-agent-policy-channel-select?ref=main' \
              > "$protected_selector"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/happyvertical/.github/contents/scripts/hv_agent_policy_channels.py?ref=main' \
              > "$protected_channels"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/happyvertical/.github/contents/.github/agent-policy-lock.json?ref=main' \
              > "$active_lock"
            chmod +x "$protected_selector"
          elif grep -q 'HTTP 404' "$active_state_error"; then
            channels_active=false
            gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/happyvertical/.github/contents/.github/agent-policy-lock.json?ref=main' \
              > "$active_lock"
            python3 - "$active_lock" "$active_state" <<'PY'
          import json
          import re
          import sys

          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          fields = {
              "schema", "artifact", "generation", "policy_revision",
              "source_commit", "source_tree_sha256",
          }
          if not isinstance(lock, dict) or set(lock) != fields:
              raise SystemExit("generation-7 bootstrap lock has unexpected fields")
          if lock.get("schema") != "hv-agent-policy-lock:v1" or lock.get("generation") != 7:
              raise SystemExit("missing central channels may bootstrap only from stable generation 7")
          if not re.fullmatch(
              r"ghcr\.io/happyvertical/agent-policy@sha256:[0-9a-f]{64}",
              str(lock.get("artifact")),
          ):
              raise SystemExit("generation-7 bootstrap lock has an invalid artifact")
          if not re.fullmatch(r"[0-9a-f]{40}", str(lock.get("source_commit"))):
              raise SystemExit("generation-7 bootstrap lock has an invalid source commit")
          if not re.fullmatch(r"[0-9a-f]{64}", str(lock.get("source_tree_sha256"))):
              raise SystemExit("generation-7 bootstrap lock has an invalid source tree")
          if not isinstance(lock.get("policy_revision"), str) or not lock["policy_revision"]:
              raise SystemExit("generation-7 bootstrap lock has an invalid policy revision")
          state = {
              "schema": "hv-agent-policy-channels:v1",
              "revision": 1,
              "default_channel": "stable",
              "channels": {"stable": lock},
              "assignments": {},
              "promotion": None,
              "transition": {
                  "action": "bootstrap",
                  "from_revision": 0,
                  "to_revision": 1,
                  "artifact": lock["artifact"],
                  "previous_artifact": None,
                  "evidence_sha256": None,
                },
          }
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              json.dump(state, output, indent=2, sort_keys=True)
              output.write("\n")
          PY
          else
            cat "$active_state_error" >&2
            exit 1
          fi
          selected_lock="$RUNNER_TEMP/hv-agent-policy-selected-lock.json"
          if test "$channels_active" = true; then
            if test "$TARGET_REPOSITORY_NUMERIC_ID" = 1129270614 \
                && test "$EVENT_NAME" != workflow_dispatch; then
              # Explicit fail-closed form. The equivalent `test A && test B || {
              # ...; }` reads as if-then-else but is not one, and ShellCheck
              # rejects it as SC2015 in consumers that lint this byte-canonical
              # workflow (happyvertical/.github#66).
              if ! test -f .github/agent-policy-channels.json \
                  || ! test -f .github/agent-policy-lock.json; then
                echo 'central policy channels cannot be removed after bootstrap' >&2
                exit 1
              fi
            fi
            candidate=()
            if test "$TARGET_REPOSITORY_NUMERIC_ID" = 1129270614 \
                && test "$EVENT_NAME" != workflow_dispatch \
                && test -f .github/agent-policy-channels.json \
                && test -f .github/agent-policy-lock.json; then
              if ! cmp -s .github/agent-policy-channels.json "$active_state"; then
                candidate=(.github/agent-policy-channels.json .github/agent-policy-lock.json)
                transition_revision=$(jq -r '.transition.to_revision' .github/agent-policy-channels.json)
                transition_evidence=".github/agent-policy-evidence/revision-${transition_revision}.json"
                if test -f "$transition_evidence"; then
                  transition_bundle=".github/agent-policy-evidence/revision-${transition_revision}.bundle"
                  test -f "$transition_bundle" || {
                    echo "transition evidence lacks its protected rollout signature bundle" >&2
                    exit 1
                  }
                  cosign verify-blob "$transition_evidence" \
                    --bundle "$transition_bundle" \
                    --certificate-identity 'https://github.com/happyvertical/.github/.github/workflows/agent-policy-rollout.yml@refs/heads/main' \
                    --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
                  candidate+=("$transition_evidence")
                fi
              elif ! cmp -s .github/agent-policy-lock.json "$active_lock"; then
                candidate=(.github/agent-policy-lock.json)
              fi
            fi
            target_repository_id=$(gh api "repos/$TARGET_REPOSITORY" --jq '.node_id')
            channel=$(python3 "$protected_selector" \
              "$active_state" "$selected_lock" "$target_repository_id" "${candidate[@]}")
          else
            cp "$RUNNER_TEMP/hv-agent-policy-active-lock.json" "$selected_lock"
            channel=stable
          fi
          artifact=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifact"])' "$selected_lock")
          {
            echo "HV_POLICY_ARTIFACT=$artifact"
            echo "HV_POLICY_CHANNEL=$channel"
            echo "HV_POLICY_LOCK=$selected_lock"
          } >> "$GITHUB_ENV"
      - name: Load locked policy runtime
        env:
          POLICY_ARTIFACT: ${{ env.HV_POLICY_ARTIFACT }}
          POLICY_PUBLISHER_IDENTITY: ${{ vars.AGENT_POLICY_PUBLISHER_IDENTITY }}
        run: |
          case "$POLICY_ARTIFACT" in
            ghcr.io/happyvertical/agent-policy@sha256:*) ;;
            *) echo 'source-owned policy channel must select the trusted HappyVertical policy image by digest' >&2; exit 1 ;;
          esac
          expected_publisher_identity_sha256=86a917ce537a9e923ce02103068c76eb72629247ab584f7d368ac238a0209857
          publisher_identity_sha256=$(python3 -c 'import hashlib, os; print(hashlib.sha256(os.environ["POLICY_PUBLISHER_IDENTITY"].encode()).hexdigest())')
          test "$publisher_identity_sha256" = "$expected_publisher_identity_sha256" || {
            echo 'AGENT_POLICY_PUBLISHER_IDENTITY must match the exact protected-main publisher identity' >&2
            exit 1
          }
          publisher_workflow="${POLICY_PUBLISHER_IDENTITY%@refs/heads/main}"
          test "$publisher_workflow" != "$POLICY_PUBLISHER_IDENTITY" || {
            echo 'AGENT_POLICY_PUBLISHER_IDENTITY must name the protected-main publisher workflow' >&2
            exit 1
          }
          publisher_workflow_regexp=$(printf '%s' "$publisher_workflow" | sed 's/[][\.*^()+?{}|$]/\\&/g')
          cosign verify "$POLICY_ARTIFACT" \
            --certificate-identity-regexp "^${publisher_workflow_regexp}@refs/(heads/main|tags/agent-policy-v[0-9]+\.[0-9]+\.[0-9]+)$" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          policy_download_dir="$RUNNER_TEMP/hv-policy-download"
          policy_dir="$RUNNER_TEMP/hv-policy"
          rm -rf "$policy_download_dir" "$policy_dir"
          mkdir -p "$policy_download_dir" "$policy_dir"
          oras pull "$POLICY_ARTIFACT" -o "$policy_download_dir"
          archive="$policy_download_dir/agent-policy.tar.gz"
          test -f "$archive" || { echo 'policy artifact is missing agent-policy.tar.gz' >&2; exit 1; }
          python3 - "$archive" <<'PY'
          import pathlib
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe policy archive member: {member.name}")
          PY
          tar -xzf "$archive" -C "$policy_dir"
          identity=$(python3 "$policy_dir/scripts/verify-policy-artifact" "$policy_dir")
          python3 - "$HV_POLICY_LOCK" "$policy_dir/policy-artifact.json" "$POLICY_ARTIFACT" <<'PY'
          import json
          import sys

          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = {
              "artifact": sys.argv[3],
              "generation": manifest.get("generation"),
              "policy_revision": manifest.get("policy_revision"),
              "source_commit": manifest.get("source_commit"),
              "source_tree_sha256": manifest.get("source_tree_sha256"),
              "rollout": manifest.get("rollout"),
          }
          for field, value in expected.items():
              if lock.get(field) != value:
                  raise SystemExit(
                      f"selected policy lock {field} does not match signed artifact manifest"
                  )
          PY
          echo "Loaded $identity from $HV_POLICY_CHANNEL channel $POLICY_ARTIFACT"
          echo "HV_POLICY_DIR=$policy_dir" >> "$GITHUB_ENV"
          echo "HV_POLICY_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Validate lifecycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_ARTIFACT: ${{ env.HV_POLICY_ARTIFACT }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if test "$EVENT_NAME" = workflow_dispatch && test "${PR_NUMBER:-0}" = 0; then
            python3 "$HV_POLICY_DIR/scripts/hv-agent" audit .
            exit
          fi
          numbers_file="$RUNNER_TEMP/hv-agent-lifecycle-prs"
          "$HV_POLICY_DIR/scripts/hv-agent-lifecycle-prs" > "$numbers_file"
          while IFS= read -r number; do
            if ! python3 "$HV_POLICY_DIR/scripts/hv-agent" check-pr "$number"; then
              echo "ERROR $HV_POLICY_IDENTITY from $POLICY_ARTIFACT rejected PR #$number; correct canonical claim/PR state, then rerun the organization-required workflow execution; a repository-local lifecycle-only dispatch is not protected merge authority and draft toggles are invalid" >&2
              exit 1
            fi
          done < "$numbers_file"
