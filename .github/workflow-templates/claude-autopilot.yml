# Claude Agent Autopilot
#
# Copy this file to your repository's .github/workflows/on-label-changed.yml
#
# Required org secrets:
#   - CLAUDE_CODE_OAUTH_TOKEN: Claude Code Max OAuth token.
#   - GH_TOKEN: token carrying repo write. The default GITHUB_TOKEN is not
#     sufficient here: a PR pushed with GITHUB_TOKEN does not trigger the
#     downstream workflow runs the resulting PR has to pass.
#
# No policy artifact is needed. The autopilot claims the issue with plain
# GitHub state - the `agent: implementation` label plus one `<!-- hv-claim -->`
# comment it edits in place when it hands off.
#
# The policy_artifact / project_id / status_*_id inputs on the reusable
# workflow are deprecated and are intentionally not passed here.

name: Label Changed

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  # Trigger Claude dispatch without conflating it with implementation ownership.
  autopilot:
    if: "${{ github.event.label.name == 'dispatch: claude' }}"
    uses: happyvertical/.github/.github/workflows/org-agent-autopilot.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}
      label_name: ${{ github.event.label.name }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
